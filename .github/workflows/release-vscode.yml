# Releases the VS Code extension. main carries the next version with a -dev suffix (e.g. 0.1.3-dev); the workflow
# releases it without the suffix (commit and tag vscode-0.1.3), then sets the next development version (0.1.4-dev, or
# the one entered) and publishes the released .vsix to the VS Code Marketplace and Open VSX with trusted publishing
# (OIDC, no stored tokens).
#
# Both registries trust this workflow by its file name (release-vscode.yml) and the "release" environment, see
# Trusted Publishing on https://marketplace.visualstudio.com/manage/publishers/jungm and
# https://open-vsx.org/user-settings/trusted-publishers.
#
# A failed publish job can be re-run on its own ("Re-run failed jobs"): it publishes the .vsix built by the release job
# and skips a registry that already has the version.
name: Release VS Code extension

on:
  workflow_dispatch:
    inputs:
      next:
        description: Next development version without -dev, defaults to the next patch version
        type: string
        required: false

concurrency:
  group: release-vscode
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        name: Determine versions
        env:
          NEXT: ${{ inputs.next }}
        run: |
          current=$(node -p "require('./vscode/package.json').version")
          if [[ "$current" != *-dev ]]; then
            echo "::error::vscode/package.json has version $current, expected a -dev version"
            exit 1
          fi
          release=${current%-dev}
          next=${NEXT%-dev}
          if [[ -z "$next" ]]; then
            IFS=. read -r major minor patch <<< "$release"
            next="$major.$minor.$((patch + 1))"
          fi
          if [[ ! "$next" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "$next" == "$release" \
              || "$(printf '%s\n%s\n' "$release" "$next" | sort -V | tail -1)" != "$next" ]]; then
            echo "::error::Next version '$next' must be a version x.y.z above $release"
            exit 1
          fi
          echo "Releasing $release, next development version $next-dev"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "next=$next-dev" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - run: mvn -B verify

      - name: Package
        working-directory: vscode
        env:
          VERSION: ${{ steps.version.outputs.release }}
        run: |
          npm ci
          npm version "$VERSION" --no-git-tag-version
          npm run server
          npx vsce package --out "faces-$VERSION.vsix"

      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.version.outputs.release }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Release VS Code extension $VERSION" vscode/package.json vscode/package-lock.json
          git tag -a "vscode-$VERSION" -m "VS Code extension $VERSION"
          (cd vscode && npm version "$NEXT" --no-git-tag-version)
          git commit -m "Prepare VS Code extension $NEXT" vscode/package.json vscode/package-lock.json
          git push --atomic origin HEAD:main "vscode-$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: vscode/faces-${{ steps.version.outputs.release }}.vsix
          if-no-files-found: error

  publish:
    needs: release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      VSIX: faces-${{ needs.release.outputs.version }}.vsix
    steps:
      - uses: actions/checkout@v7
        with:
          ref: vscode-${{ needs.release.outputs.version }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci
        working-directory: vscode
      - uses: actions/download-artifact@v8
        with:
          name: vsix
          path: vscode

      - name: Publish to the VS Code Marketplace
        working-directory: vscode
        run: npx vsce publish --oidc --packagePath "$VSIX" --skip-duplicate

      - name: Publish to Open VSX
        if: ${{ !cancelled() }}
        working-directory: vscode
        run: npx --yes ovsx@1.4.0 publish "$VSIX" --trusted-publishing --skip-duplicate
